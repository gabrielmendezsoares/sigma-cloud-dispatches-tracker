openapi: 3.0.3
info:
  title: 🚓 Sigma Cloud Dispatches Tracker
  version: 1.0.5
  description: |
    ## 📋 Overview

    Sigma Cloud Dispatches Tracker is a scheduled monitoring job designed to detect excessive dispatch activity reported by Segware. It operates on a 2-day rolling window, retrieving dispatch records from all companies via the Segware API. The service analyzes each account's total number of dispatches and flags accounts that exceed a configurable threshold.

    Once a threshold breach is detected, the system enriches the data with account, company, and client group metadata from Segware APIs. Alerts are sent through WhatsApp and also injected into the Segware alarm system for centralized visibility. The system tracks active alerts in a trigger table to prevent repeated notifications and automatically clears alerts when dispatch volume normalizes.

    This service plays a critical role in identifying accounts that may be misconfigured or experiencing abnormal security activity, helping operational teams act swiftly and proactively.

    ### 🎯 Objectives 
    
    - Monitor dispatch activity over a rolling 2-day period
    - Fetch dispatches for all companies using the Segware API
    - Filter and aggregate dispatches per account
    - Calculate the total number of dispatches across all types per account
    - Detect when total dispatches exceed the defined threshold
    - Track alert state per account to avoid duplicate notifications
    - Clear alerts when dispatch volumes return to normal
    - Enrich alert data with account, company, and client group metadata
    - Send alert notifications via WhatsApp using the ChatPro API
    - Inject dispatch-related alerts into the Segware alarm system
    - Persist alerts and metadata in internal logging tables
    - Log all operations and errors for auditability and diagnostics
    - Run as a recurring background job suitable for scheduled execution
servers:
  - url: http://localhost:3777
    description: Development server
components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: Basic authentication using username and password
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer authentication using JWT token
  schemas:
    IResponseData:
      type: object
      required:
        - message
        - suggestion
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: "Authentication token has expired."
        suggestion:
          type: string
          description: Suggested action to resolve the error.
          example: "Please sign in again to obtain a new token."
    IGetAuthenticationResponseData:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - username
            - roleList
            - token
            - expiresIn
          properties:
            username:
              type: string
              description: Username of the authenticated user.
              example: "john.doe"
            roleList:
              type: array
              description: Roles or permissions assigned to the user.
              items:
                type: string
              example: ["admin", "user"]
            token:
              type: string
              description: Signed JWT token for subsequent authenticated requests.
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            expiresIn:
              type: integer
              format: int64
              description: Token expiration time in milliseconds.
              example: 1726080123123
    IGetHealthResponseData:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - cpuUsage
            - memoryUsage
            - port
            - logLevel
          properties:
            cpuUsage:
              type: object
              required:
                - name
                - value
              properties:
                name:
                  type: string
                  description: Label for CPU usage metric.
                  example: "Uso de CPU"
                value:
                  type: string
                  description: Value of CPU usage.
                  example: "8.1%"
                isListeningModifiedEvent:
                  type: boolean
                  description: If monitor should listen for modification events.
                  example: false
            memoryUsage:
              type: object
              required:
                - name
                - value
              properties:
                name:
                  type: string
                  description: Label for memory usage metric.
                  example: "Uso de memória"
                value:
                  type: string
                  description: Value of memory usage.
                  example: "8.1MB"
                isListeningModifiedEvent:
                  type: boolean
                  description: If monitor should listen for modification events.
                  example: false
            port:
              type: object
              required:
                - name
                - value
              properties:
                name:
                  type: string
                  description: Label indicating which port the application is running on.
                  example: "Porta"
                value:
                  type: string
                  description: Port number the application is currently using.
                  example: "3000"
                isListeningModifiedEvent:
                  type: boolean
                  description: If monitor should listen for modification events.
                  example: true
            logLevel:
              type: object
              required:
                - name
                - value
              properties:
                name:
                  type: string
                  description: Label indicating the current logging level.
                  example: "Nível de log"
                value:
                  type: string
                  description: Current log level set for the application.
                  example: "info"
                isListeningModifiedEvent:
                  type: boolean
                  description: If monitor should listen for modification events.
                  example: true
tags:
  - name: Application
    description: Core system operations including authentication, health monitoring, and system management
paths:
  /api/v1/get/authentication:
    get:
      tags:
        - Application
      summary: Authenticate user and issue JWT token
      description: |
        Authenticates a user via Basic Authentication and issues a signed JWT token upon successful validation.
        A request was made on it to verify credentials and generate an access token for authorized usage.
      security:
        - Basic: []
      responses:
        '200':
          description: The request was successfully received, understood, and processed. A valid response was generated based on the request made on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IGetAuthenticationResponseData'
              example:
                data:
                  username: "john.doe"
                  roleList: ["admin", "user"]
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  expiresIn: 1726080123123
        '400':
          description: The server could not process the request due to invalid syntax, malformed data, or missing parameters. Although there was a request on it, the client must correct the request before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              examples:
                example_1:
                  summary: Authorization header required for secure access
                  value:
                    message: "Authorization header required for secure access."
                    suggestion: "Include an Authorization header using the Basic scheme: \"Basic base64(username:password)\"."
                example_2:
                  summary: Authorization must use Basic authentication scheme
                  value:
                    message: "Authorization must use Basic authentication scheme."
                    suggestion: "Use the Basic authentication scheme: \"Basic base64(username:password)\"."
        '401':
          description: The request was received and a request was made on it, but the client failed to provide valid authentication credentials. Access is denied until proper authentication is provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              examples:
                example_1:
                  summary: Invalid username
                  value:
                    message: "Invalid username."
                    suggestion: "Ensure the username is correct or register for an account if you don’t have one."
                example_2:
                  summary: Incorrect password
                  value:
                    message: "Incorrect password."
                    suggestion: "Double-check your password or reset it if you’ve forgotten it."
        '403':
          description: Account is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              example:
                message: "Account is inactive."
                suggestion: "Contact your administrator to request account reactivation."
        '500':
          description: Authentication process encountered a technical issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              example:
                message: "Authentication process encountered a technical issue."
                suggestion: "Please try again later or contact support if the issue persists."
  /api/v1/get/health:
    get:
      tags:
        - Application
      summary: Retrieve application health metrics
      description: |
        Returns current system health indicators such as CPU and memory usage.
        A request was made on it to monitor the application’s operational status in real time.
      security:
        - Bearer: []
      responses:
        '200':
          description: The request was successfully received, understood, and processed. A valid response was generated based on the request made on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IGetHealthResponseData'
              example:
                data:
                  cpuUsage:
                    name: "Uso de CPU"
                    value: "8.1%"
                  memoryUsage:
                    name: "Uso de memória"
                    value: "8.1MB"
                  port:
                    name: "Porta"
                    value: "3000"
                    isListeningModifiedEvent: true
                  logLevel:
                    name: "Nível de log"
                    value: "info"
                    isListeningModifiedEvent: true
        '400':
          description: The server could not process the request due to invalid syntax, malformed data, or missing parameters. Although there was a request on it, the client must correct the request before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              examples:
                example_1:
                  summary: Missing Authorization header
                  value:
                    message: "Missing Authorization header."
                    suggestion: "Include an Authorization header using the Bearer scheme: \"Bearer <token>\"."
                example_2:
                  summary: Invalid Authorization scheme
                  value:
                    message: "Invalid Authorization scheme."
                    suggestion: "Use the Bearer authentication scheme: \"Bearer <token>\"."
        '401':
          description: The request was received and a request was made on it, but the client failed to provide valid authentication credentials. Access is denied until proper authentication is provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              examples:
                example_1:
                  summary: Authentication token has expired
                  value:
                    message: "Authentication token has expired."
                    suggestion: "Please sign in again to obtain a new token."
                example_2:
                  summary: Invalid authentication token
                  value:
                    message: "Invalid authentication token."
                    suggestion: "Ensure your token is valid and has not been tampered with."
                example_3:
                  summary: Authentication token is not yet active
                  value:
                    message: "Authentication token is not yet active."
                    suggestion: "Wait until the token’s start time before using it."
                example_4:
                  summary: Authentication token has expired
                  value:
                    message: "Authentication token has expired."
                    suggestion: "Please sign in again to obtain a new token."
        '403':
          description: Missing required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              example:
                message: "Missing required role."
                suggestion: "If you believe this is an error, contact your administrator to request appropriate access."    
        '500':
          description: The server encountered an unexpected error while processing the request. A request was made on it, but the server failed to complete the operation due to an internal issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseData'
              examples:
                example_1:
                  summary: The authorization process is temporarily unavailable
                  value:
                    message: "The authorization process is temporarily unavailable."
                    suggestion: "Please try again later or contact support if the issue persists."
                example_2:
                  summary: The authorization process encountered a technical issue
                  value:
                    message: "The authorization process encountered a technical issue."
                    suggestion: "Please try again later or contact support if the issue persists."
                example_3:
                  summary: The health diagnostic process encountered a technical issue
                  value:
                    message: "The health diagnostic process encountered a technical issue."
                    suggestion: "Please try again later or contact support if the issue persists."
